name: CI

# Pull request checks and the same checks on main. Netlify builds the preview (pull requests) and the
# live site (main) on its own through its GitHub app, and posts the preview link on the pull request.
# Visual regression runs in the pinned container (F6). Every action is pinned to a commit; tests/ci.test.ts checks that.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (typecheck, lint, format, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Component tests run in a real Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # The build also runs the bundle-size check.
      - run: npm run build

  e2e:
    name: End to end (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Includes the axe accessibility checks. Playwright builds and serves the app itself.
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual:
    name: Visual regression (pinned container)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one container baselines are made and checked in; keep in step with config/visual.json
    # (tests/visual-container.test.ts checks it).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    env:
      CUE_VISUAL_CONTAINER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run e2e:visual
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-visual
          path: |
            playwright-report/
            test-results/
          retention-days: 7
