name: Spikes

# Throwaway: runs the sprint 0 spike tests on Linux, mainly to get Firefox numbers because Firefox
# cannot start on Peter's PC. Runs when spike files change, or by hand. Each job writes its results
# as one annotation so they can be read from the run page and the API. Delete this workflow at Gate 1.
# Every action is pinned to a commit; tests/ci.test.ts checks that.

on:
  push:
    paths:
      - 'spikes/**'
      - '.github/workflows/spikes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    name: ${{ matrix.spike }} (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # SP-1 ran at commit 638ce97 and SP-2 at 58c659a; both are finished. Add new spikes here.
          - { spike: sp-3, project: chromium, browser: chromium }
          - { spike: sp-3, project: firefox, browser: firefox }
          - { spike: sp-3, project: webkit, browser: webkit }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - id: run
        continue-on-error: true
        env:
          SPIKE: ${{ matrix.spike }}
        run: npx playwright test -c spikes/playwright.config.ts --project=${{ matrix.project }} --reporter=list
      - name: Report
        if: always()
        run: |
          REPORT=$(node spikes/${{ matrix.spike }}/report.mjs "${{ matrix.project }}" || true)
          echo "$REPORT" | tee -a "$GITHUB_STEP_SUMMARY"
          ESCAPED="${REPORT//'%'/'%25'}"
          ESCAPED="${ESCAPED//$'\r'/'%0D'}"
          ESCAPED="${ESCAPED//$'\n'/'%0A'}"
          echo "::notice title=${{ matrix.spike }} results (${{ matrix.project }}), tests ${{ steps.run.outcome }}::${ESCAPED}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ matrix.spike }}-${{ matrix.project }}
          path: |
            spikes/${{ matrix.spike }}/results/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
