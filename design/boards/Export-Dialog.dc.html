<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="position:relative; width:960px; height:680px; overflow:hidden; font-family:'Instrument Sans', system-ui, sans-serif; color:#14281B; font-size:13px; background:#E8F0E4">

<div style="position:absolute; left:0; top:0; right:0; height:52px; background:#FFFFFF; border-bottom:1px solid #DCE6D7"></div>
<div style="position:absolute; left:0; top:52px; bottom:0; width:160px; background:#FFFFFF; border-right:1px solid #DCE6D7"></div>
<div style="position:absolute; right:0; top:52px; bottom:0; width:220px; background:#FFFFFF; border-left:1px solid #DCE6D7"></div>
<div style="position:absolute; left:220px; top:110px; width:520px; aspect-ratio:16/9; background:#FFFFFF; box-shadow:0 14px 36px rgba(20,40,27,.12)"></div>
<div style="position:absolute; inset:0; background:rgba(20,40,27,.46)"></div>

<div role="dialog" aria-label="Export deck" style="position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); width:600px; background:#FFFFFF; border-radius:12px; box-shadow:0 24px 64px rgba(20,40,27,.32); overflow:hidden">

<div style="display:flex; align-items:flex-start; justify-content:space-between; padding:20px 24px 14px">
<div>
<div style="font-weight:700; font-size:18px; letter-spacing:-.01em">Export deck</div>
<div style="color:#5B6F61; margin-top:2px">Autumn Launch · 12 slides</div>
</div>
<button aria-label="Close" style="width:32px; height:32px; border:0; background:transparent; border-radius:6px; display:inline-flex; align-items:center; justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>

<div style="padding:0 24px 20px; display:flex; flex-direction:column; gap:10px">

<div style="border:2px solid #17803F; background:#F4FAF5; border-radius:10px; padding:14px 16px; margin:-1px">
<label for="fmt-html" style="display:flex; gap:12px; cursor:pointer">
<input id="fmt-html" type="radio" name="fmt" checked style="margin:3px 0 0; accent-color:#17803F; width:16px; height:16px; flex:none">
<span style="flex:1">
<span style="display:flex; justify-content:space-between; align-items:baseline"><span style="font-weight:600; font-size:14px">Standalone web page</span><span style="font-size:12px; color:#5B6F61">.html · about 4.2 MB</span></span>
<span style="display:block; margin-top:3px; color:#3F5A48; line-height:1.45">One file that plays in any browser, online or offline. Keeps your animations, transitions and fonts. Email it, or put it on a website.</span>
</span>
</label>
<div style="margin:12px 0 0 28px; padding-top:12px; border-top:1px solid #DCE6D7; display:flex; flex-direction:column; gap:8px">
<label for="opt-notes" style="display:flex; align-items:center; gap:10px; cursor:pointer"><input id="opt-notes" type="checkbox" checked style="margin:0; accent-color:#17803F; width:15px; height:15px">Include speaker notes<span style="color:#5B6F61">(press N in the page to show them)</span></label>
<label for="opt-embed" style="display:flex; align-items:center; gap:10px; cursor:pointer"><input id="opt-embed" type="checkbox" checked style="margin:0; accent-color:#17803F; width:15px; height:15px">Embed fonts and images<span style="color:#5B6F61">(needed for offline use)</span></label>
</div>
</div>

<div style="border:1px solid #DCE6D7; background:#FFFFFF; border-radius:10px; padding:14px 16px">
<label for="fmt-deck" style="display:flex; gap:12px; cursor:pointer">
<input id="fmt-deck" type="radio" name="fmt" style="margin:3px 0 0; accent-color:#17803F; width:16px; height:16px; flex:none">
<span style="flex:1">
<span style="display:flex; justify-content:space-between; align-items:baseline"><span style="font-weight:600; font-size:14px">Editable deck file</span><span style="font-size:12px; color:#5B6F61">.slides · about 3.8 MB</span></span>
<span style="display:block; margin-top:3px; color:#3F5A48; line-height:1.45">A backup you can open here again, or on another computer. Everything stays editable.</span>
</span>
</label>
</div>

<div style="border:1px solid #DCE6D7; background:#F4F8F1; border-radius:10px; padding:14px 16px; opacity:.75">
<label for="fmt-pdf" style="display:flex; gap:12px">
<input id="fmt-pdf" type="radio" name="fmt" disabled style="margin:3px 0 0; width:16px; height:16px; flex:none">
<span style="flex:1">
<span style="display:flex; justify-content:space-between; align-items:center"><span style="font-weight:600; font-size:14px">PDF or images</span><span style="height:20px; padding:0 8px; display:inline-flex; align-items:center; border-radius:10px; background:#F5C542; color:#14281B; font-size:11px; font-weight:700">Coming later</span></span>
<span style="display:block; margin-top:3px; color:#5B6F61; line-height:1.45">For printing and sharing as flat pages. Animations won’t carry over.</span>
</span>
</label>
</div>

</div>

<div style="display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-top:1px solid #DCE6D7; background:#F9FBF7">
<span style="display:inline-flex; align-items:center; gap:8px; color:#5B6F61"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Made on your device. Nothing is uploaded.</span>
<span style="display:inline-flex; gap:10px">
<button style="height:36px; padding:0 16px; border:1px solid #DCE6D7; background:#FFFFFF; border-radius:7px; font-weight:500">Cancel</button>
<button style="height:36px; padding:0 18px; border:0; background:#17803F; color:#FFFFFF; border-radius:7px; font-weight:600; display:inline-flex; align-items:center; gap:8px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Export web page</button>
</span>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":680}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
